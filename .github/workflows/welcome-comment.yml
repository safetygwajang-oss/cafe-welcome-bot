name: Welcome Comment Bot

on:
  schedule:
    # ⚠️ GitHub Actions는 UTC 기준! (KST = UTC + 9)
    # KST 08:00 → UTC 23:00 (전날)
    # KST 13:00 → UTC 04:00
    # KST 18:00 → UTC 09:00
    - cron: '0 23 * * *'
    - cron: '0 4 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:   # 👉 GitHub 웹에서 수동 실행 버튼

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # state 파일 자동 커밋용
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run welcome comment bot
        env:
          NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_REFRESH_TOKEN: ${{ secrets.NAVER_REFRESH_TOKEN }}
          CAFE_ID:             ${{ secrets.CAFE_ID }}
          WELCOME_MENU_ID:     ${{ secrets.WELCOME_MENU_ID }}
        run: python welcome_comment.py

      - name: Commit state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/commented.json || true
          git diff --cached --quiet || git commit -m "chore: update commented state"
          git push
